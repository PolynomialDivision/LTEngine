# LTEngine on a single small NVIDIA GPU (tuned for a 4 GB GTX 1650 on Unraid).
#
#   mkdir -p /mnt/user/appdata/ltengine/models
#   chown -R 99:100 /mnt/user/appdata/ltengine
#   docker compose up -d --build
#
# The first start downloads the model (~7 GB) into the models directory;
# later starts load it from there.
services:
  ltengine:
    build: .
    image: ltengine:cuda
    container_name: ltengine
    restart: unless-stopped
    # Unraid's nobody:users, so files in appdata stay manageable from the host.
    user: "99:100"
    init: true
    volumes:
      - /mnt/user/appdata/ltengine/models:/models
    environment:
      # TranslateGemma 12B (Q4_K_M, ~7 GB): best quality. On a 4 GB GPU about
      # a third runs on the GPU, the rest on the CPU (needs ~8 GB free RAM).
      # For speed over quality: translategemma-4b (fits fully on the GPU).
      LTENGINE_MODEL: translategemma-12b
      # LTENGINE_MODEL_FILE: /models/translategemma-12b-it.Q4_K_M.gguf  # use a local file instead
      LTENGINE_CTX_SIZE: "4096"
      LTENGINE_GPU_LAYERS: auto
      LTENGINE_QUEUE_SIZE: "16"
      # 12B generates ~5-8 tokens/s here; long messages take a minute.
      LTENGINE_QUEUE_TIMEOUT: "300"
      # LTENGINE_THREADS: "6"           # default: physical cores
      # LTENGINE_VRAM_MARGIN: "512"      # MiB kept free on the GPU
      # LTENGINE_API_KEY: change-me
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Only reachable from containers on this network (e.g. the Matrix bot at
    # http://ltengine:5050). Uncomment to expose it on the host's loopback.
    # ports:
    #   - "127.0.0.1:5050:5050"
    networks:
      - translate
    healthcheck:
      test: ["CMD", "ltengine", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30m
      retries: 3

networks:
  translate:
    name: translate
